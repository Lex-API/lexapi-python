name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # uv fetches any CPython (incl. 3.9, which the ubuntu-latest toolcache
      # no longer ships), so the whole supported range stays tested.
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Type-check
        if: matrix.python-version == '3.12'
        run: .venv/bin/mypy
      - name: Test
        run: .venv/bin/pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
