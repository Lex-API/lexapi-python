[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexapi"
version = "0.1.0"
description = "Official Python SDK for LexAPI - European legal data, made queryable."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "LexAPI", email = "support@lex-api.com" }]
keywords = ["eur-lex", "eu", "legal", "law", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://lex-api.com"
Documentation = "https://lex-api.com/docs"
Repository = "https://github.com/Lex-API/lexapi-python"
Issues = "https://github.com/Lex-API/lexapi-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexapi"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
