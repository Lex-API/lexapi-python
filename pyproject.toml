[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexapi-client"
version = "0.2.0"
description = "Official Python SDK for LexAPI - European legal data, made queryable."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Arieta Labs Ltd", email = "support@lex-api.com" }]
keywords = ["eur-lex", "eu", "legal", "law", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://lex-api.com"
Documentation = "https://lex-api.com/docs"
Repository = "https://github.com/Lex-API/lexapi-python"
Issues = "https://github.com/Lex-API/lexapi-python/issues"
Changelog = "https://github.com/Lex-API/lexapi-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexapi"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/lexapi"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
